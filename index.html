<title>신혜진 HRD 포트폴리오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 흰 지면 + 파스텔 그라데이션 블롭 히어로, 큰 세리프 섹션 타이틀, 보라 그라데이션 성과 배너, 프로젝트 카드, Before/Final 뷰어, 경력, Say Hello 밴드 */
:root {
  --bg: #f8f8fb;
  --paper: #ffffff;
  --ink: #1a1b25;
  --muted: #6a6e7c;
  --line: #e2e3eb;
  --accent: #4b3fe0;
  --accent-soft: #e9e6ff;
  --ok: #2f8f6b;
  --g-sky: #a9dcff;
  --g-lilac: #bba8ff;
  --g-pink: #ffc4e4;
  --display: "Cormorant Garamond", "Times New Roman", serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
html.lock { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.75; font-weight: 300;
  word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, h4, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
img { display: block; max-width: 100%; }
section { scroll-margin-top: 76px; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes morph { 0% { border-radius: 58% 42% 55% 45% / 50% 55% 45% 50%; transform: rotate(0deg); } 100% { border-radius: 44% 56% 46% 54% / 56% 44% 56% 44%; transform: rotate(16deg) scale(1.05); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 16px; }
.logo { font-family: var(--display); font-size: 26px; letter-spacing: .01em; font-weight: 500; line-height: 1; }
.rt { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; font-size: 14px; }
.nav button { padding: 4px 12px; border-radius: 999px; color: var(--muted); transition: color .2s, background .2s; }
.nav button:hover { color: var(--ink); background: #ececf3; }
.talk { font-family: var(--display); font-size: 17px; border-bottom: 1px solid var(--ink); line-height: 1.2; }
.talk:hover { color: var(--accent); border-color: var(--accent); }

/* shared */
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 500; letter-spacing: .02em; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 26px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 400; transition: transform .2s, background .2s; }
.btn:hover { transform: translateY(-2px); background: var(--accent); }
.btn.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--ink); background: var(--paper); }
.btn.sm { padding: 8px 18px; font-size: 14px; }
.sec { padding-block: 120px 0; }
.sh { margin-bottom: 40px; display: grid; gap: 10px; justify-items: start; }
.sh h2 { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 8vw, 96px); line-height: 1; letter-spacing: -.015em; }
.sh p { color: var(--muted); max-width: 520px; font-size: 14.5px; }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { padding: 8px 0; font-family: var(--display); font-size: 21px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .2s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 3px 14px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; }
.bl li { position: relative; padding-left: 16px; font-size: 14px; margin-top: 4px; }
.bl li::before { content: ""; position: absolute; left: 0; top: .8em; width: 6px; height: 1px; background: var(--accent); }
.ck li { position: relative; padding-left: 26px; font-size: 13.5px; line-height: 1.6; margin-top: 8px; }
.ck li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 17px; height: 17px; border-radius: 50%; background: #d9efe6; color: var(--ok); font-size: 11px; line-height: 17px; text-align: center; }

/* hero */
.hero { position: relative; min-height: 520px; padding-block: 72px 24px; display: grid; align-content: center; gap: 22px; overflow: hidden; }
.blob { position: absolute; right: 0; top: 2%; width: min(56vw, 480px); aspect-ratio: 1; z-index: 0; filter: blur(4px);
  background: radial-gradient(circle at 28% 28%, var(--g-sky) 0, transparent 58%), radial-gradient(circle at 72% 38%, var(--g-lilac) 0, transparent 62%), radial-gradient(circle at 48% 84%, var(--g-pink) 0, transparent 60%), #dcd6ff;
  animation: morph 12s ease-in-out infinite alternate; }
.hero > :not(.blob) { position: relative; z-index: 1; }
.hero .dash { width: 28px; height: 2px; background: var(--ink); }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(58px, 11vw, 140px); line-height: .96; letter-spacing: -.02em; }
.hero .sub { color: var(--muted); max-width: 440px; font-size: 14.5px; }
.hero .role { font-size: 13px; font-weight: 500; letter-spacing: .02em; }
.pills { display: flex; gap: 10px; flex-wrap: wrap; }
.pills button { padding: 7px 18px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; transition: box-shadow .2s, transform .2s; }
.pills button:hover { box-shadow: inset 0 0 0 1px var(--accent); transform: translateY(-2px); }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }

.stmt { font-size: clamp(28px, 5vw, 56px); font-weight: 700; line-height: 1.32; letter-spacing: -.025em; max-width: 920px; padding-top: 88px; }
.stmt em { font-style: normal; color: var(--accent); background: linear-gradient(90deg, #6a55ee, #3fa5e8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.stmt-s { margin-top: 20px; color: var(--muted); max-width: 520px; font-size: 14.5px; }

/* projects */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
.filters button { padding: 6px 18px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; transition: all .2s; }
.filters button:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.pc { display: flex; flex-direction: column; background: var(--paper); border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); transition: transform .3s, box-shadow .3s; animation: in .35s ease both; }
.pc:hover { transform: translateY(-5px); box-shadow: 0 0 0 1px var(--line), 0 30px 50px -34px rgba(60,50,140,.5); }
.pc .ph { position: relative; aspect-ratio: 4 / 3; background: linear-gradient(135deg, #e9e6fa, #f3f1fb); overflow: hidden; cursor: pointer; }
.pc .ph img { position: absolute; inset: 16px; width: calc(100% - 32px); height: calc(100% - 32px); object-fit: contain; filter: drop-shadow(0 10px 16px rgba(50,40,120,.28)); transition: transform .6s; }
.pc:hover .ph img { transform: scale(1.04); }
.pc .pb { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.pc .org { align-self: flex-start; font-size: 11.5px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 400; }
.pc h3 { font-size: 18px; font-weight: 500; line-height: 1.4; margin-top: 8px; }
.pc .role { font-family: var(--display); font-size: 18px; color: var(--muted); }
.pc .desc { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.pc .ck { margin-top: 8px; flex: 1; }
.pc .btn { margin-top: 18px; justify-content: center; width: 100%; background: #efeff5; color: var(--ink); font-size: 14px; padding: 9px 16px; }
.pc .btn:hover { background: var(--accent); color: #fff; }

/* compare */
.cmp { background: var(--paper); border-radius: 32px; padding: 32px; box-shadow: 0 0 0 1px var(--line); }
.cmp .ptabs { display: flex; gap: 8px; flex-wrap: wrap; }
.cmp .ptabs button { padding: 7px 18px; border-radius: 999px; background: var(--bg); font-size: 14px; transition: all .2s; }
.cmp .ptabs button:hover { background: #ececf3; }
.cmp .ptabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.cmp .body { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 28px; margin-top: 24px; background: var(--bg); border-radius: 24px; padding: 24px; align-items: start; }
.cmp .txt h4 { font-size: 20px; font-weight: 500; margin-top: 14px; }
.cmp .txt .box { margin-top: 14px; background: var(--paper); border-radius: 16px; padding: 16px 18px; font-size: 14px; }
.cmp .figure { display: grid; gap: 12px; min-width: 0; }
.cmp .stage { height: clamp(300px, 52vh, 480px); background: var(--paper); border-radius: 16px; }
.stage { position: relative; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line); cursor: zoom-in; overflow: hidden; width: 100%; padding: 14px; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.badge { position: absolute; top: 14px; left: 14px; font-family: var(--display); letter-spacing: .12em; text-transform: uppercase; font-size: 14px; padding: 3px 14px; border-radius: 999px; background: #e8e8ef; color: var(--muted); }
.badge.after { background: var(--accent); color: #fff; }
.badge.plan { background: var(--accent-soft); color: var(--accent); }
.stage.empty { cursor: default; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); border: 1px dashed #c9cbd8; }
.stage.empty p { color: var(--muted); font-size: 14px; text-align: center; }
.stagebox { position: relative; }
.stagebox .badge { z-index: 2; }
.stagebox .zoomhint { z-index: 2; }
.cmp .stage.tall { height: clamp(380px, 72vh, 680px); place-items: start center; align-content: start; overflow-y: auto; cursor: zoom-in; }
.stage.tall img { width: min(100%, 460px); height: auto; max-height: none; }
.stage.tall.low img { width: min(100%, 300px); }
#lb.tall.low img { width: min(100%, 420px); }
#lb.tall { overflow-y: auto; place-items: start center; }
#lb.tall img { max-height: none; width: min(100%, 720px); height: auto; }
.zoomhint { position: absolute; right: 14px; bottom: 12px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.92); padding: 2px 10px; border-radius: 999px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: #e9e9f0; justify-self: start; }
.seg button { padding: 4px 20px; border-radius: 999px; font-family: var(--display); font-size: 17px; letter-spacing: .04em; color: var(--muted); transition: all .2s; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 6px rgba(40,46,70,.16); }
.res { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 12px; }
.res > div { background: var(--paper); border-radius: 16px; padding: 14px 14px; box-shadow: 0 0 0 1px var(--line); }
.res .n { font-family: var(--display); font-size: 44px; font-weight: 300; line-height: 1; }
.res .n sup { font-size: .42em; color: var(--accent); margin-left: 2px; vertical-align: top; position: relative; top: .35em; }
.res .l { margin-top: 6px; font-size: 13px; }

/* career */
.career { display: grid; gap: 16px; }
.job { background: var(--paper); border-radius: 24px; padding: 28px 32px; box-shadow: 0 0 0 1px var(--line); display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 20px 40px; }
.job h3 { font-size: 22px; font-weight: 500; line-height: 1.35; }
.job .role { color: var(--accent); font-weight: 700; font-size: 15px; margin-top: 6px; line-height: 1.5; }
.job .per { display: inline-block; margin-top: 12px; font-size: 13px; padding: 3px 14px; border-radius: 999px; background: var(--bg); font-variant-numeric: tabular-nums; }
.job .mini { font-size: 13px; font-weight: 500; }
.job .ck { margin-top: 0; }
.job .gh { font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: .02em; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.job .mini + .gh { margin-top: 10px; padding-top: 0; border-top: 0; }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; }
.about .intro { font-size: 17px; line-height: 1.95; }
.about .intro b { font-weight: 500; }
.cinfo { display: grid; gap: 10px; margin-top: 22px; font-size: 14px; }
.cinfo dt { font-family: var(--display); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cinfo dd { overflow-wrap: anywhere; }
.rows { margin-top: 18px; display: grid; gap: 14px; animation: in .3s ease both; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.rows .t { font-weight: 400; } .rows .s { color: var(--muted); font-size: 14px; grid-column: 1; }
.rows .g { display: inline-block; font-style: normal; font-size: 11.5px; padding: 1px 10px; margin-right: 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; font-weight: 500; }
.rows .x { grid-column: 1 / -1; margin-top: 2px; }
.rows .x li { display: block; border: 0; padding: 0 0 0 14px; position: relative; font-size: 13px; color: var(--muted); line-height: 1.65; margin-top: 2px; }
.rows .x li::before { content: ""; position: absolute; left: 0; top: .85em; width: 6px; height: 1px; background: var(--accent); }
.rows .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; grid-row: 1; grid-column: 2; text-align: right; }

/* why */
.acc { display: flex; gap: 14px; }
.acc .card { flex: 1 1 0; min-width: 0; background: var(--paper); border-radius: 24px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; transition: flex .5s cubic-bezier(.2,.7,.2,1); }
.acc .card.on { flex: 3.2 1 0; }
.acc .hd { display: block; width: 100%; padding: 24px 24px 14px; }
.acc .hd h3 { font-family: var(--display); font-size: 38px; line-height: 1; font-weight: 400; }
.acc .hd span { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
.acc .bd { padding: 0 24px 24px; opacity: 0; max-height: 0; overflow: hidden; transition: opacity .35s .1s, max-height .4s; }
.acc .card.on .bd { opacity: 1; max-height: 420px; }
.acc .bd .btn { margin-top: 16px; }
.closing { margin-top: 48px; max-width: 760px; }
.closing p { font-size: clamp(17px, 2vw, 21px); font-weight: 400; }
.closing p + p { color: var(--accent); font-weight: 500; margin-top: 6px; }

/* hello */
.hello { border-radius: 36px; text-align: center; padding: clamp(56px, 9vw, 110px) 24px; display: grid; justify-items: center; gap: 18px;
  background: radial-gradient(circle at 18% 28%, #cfe9ff 0, transparent 52%), radial-gradient(circle at 84% 18%, #e2d4ff 0, transparent 56%), radial-gradient(circle at 62% 96%, #ffd9ee 0, transparent 56%), #f1eefb; }
.hello h2 { font-family: var(--display); font-weight: 400; font-size: clamp(64px, 12vw, 160px); line-height: .95; letter-spacing: -.02em; }
.hello p { color: var(--muted); max-width: 440px; }
.mail { display: inline-flex; align-items: center; gap: 12px; padding: 10px 12px 10px 22px; background: #fff; border-radius: 999px; box-shadow: 0 16px 30px -22px rgba(60,50,140,.6); font-size: 16px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.mail button { font-size: 13px; padding: 4px 16px; border-radius: 999px; background: var(--ink); color: #fff; }
.mail button:hover { background: var(--accent); }
.hello .tel { font-size: 14px; color: var(--muted); }

.foot { margin-top: 56px; padding-block: 22px 40px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px 24px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

/* modal */
#md { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); animation: in .25s ease both; }
.mtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px 14px; font-size: 14px; color: var(--muted); }
.mtop button { color: var(--ink); padding: 6px 16px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.mtop button:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 48px; padding-bottom: 56px; }
.dgrid .stage { height: clamp(360px, 64vh, 720px); background: var(--paper); border-radius: 20px; padding: 20px; }
.stagewrap { position: relative; }
.sa { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.95); box-shadow: 0 8px 20px -8px rgba(40,46,70,.6); display: grid; place-items: center; font-size: 18px; text-align: center; transition: background .2s, color .2s; }
.sa:hover { background: var(--ink); color: #fff; }
.sa.prev { left: 12px; } .sa.next { right: 12px; }
.cnt { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.92); padding: 2px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.mctl { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
.cap { font-size: 14px; font-weight: 400; }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.thumbs button { width: 104px; height: 76px; border-radius: 10px; overflow: hidden; background: #e8e8ef; opacity: .6; box-shadow: 0 0 0 2px transparent; transition: all .2s; }
.thumbs button:hover { opacity: 1; }
.thumbs button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.info .tag { display: inline-block; font-size: 12px; letter-spacing: .06em; padding: 3px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.info h2 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 4.8vw, 60px); line-height: 1.05; margin-top: 14px; }
.info .ko-t { font-size: 18px; font-weight: 500; margin-top: 6px; }
.info .lead { color: var(--muted); margin-top: 8px; }
.info .tabs { margin-top: 26px; }
.tp { padding-block: 22px 8px; min-height: 280px; animation: in .3s ease both; }
.tp p + p { margin-top: 10px; }
.tp .mini { font-family: var(--display); font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.tp .mini:first-child { margin-top: 0; }
.ba { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: stretch; margin-top: 22px; }
.ba > div { padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.65; }
.ba small { display: block; font-family: var(--display); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
.ba .b { background: #ececf2; } .ba .b small { color: var(--muted); }
.ba .a { background: var(--accent-soft); } .ba .a small { color: var(--accent); }
.ba .ar { background: none; padding: 0; align-self: center; font-family: var(--display); font-size: 26px; color: var(--accent); }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; padding-top: 0; }
.steps .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-top: 9px; }

    var nums = { before: '1단계: ', plan: '2단계: ', after: '3단계: ' };
    var i = Math.min(S.cidx, Math.max(imgs.length - 1, 0));
    var badge = '<span class="badge ' + S.cstage + '">' + names[S.cstage] + '</span>';
    var tall = imgs.length && TALL[imgs[i]];
    var altx = esc(c.label + ' ' + names[S.cstage]);
    var stage = imgs.length
      ? (tall
        ? '<div class="stagebox">' + badge + '<div class="stage tall' + (tall === 2 ? ' low' : '') + '" role="button" tabindex="0" data-act="zoomc" aria-label="이미지 크게 보기"><img id="cmpimg" src="' + src(imgs[i]) + '" alt="' + altx + '"></div><span class="zoomhint">스크롤해서 전체 보기 · 클릭하면 크게</span></div>'
        : '<button class="stage" type="button" data-act="zoomc" aria-label="이미지 크게 보기">' + badge + '<img id="cmpimg" src="' + src(imgs[i]) + '" alt="' + altx + '"><span class="zoomhint">클릭해서 크게 보기</span></button>')
      : '<div class="stage empty">' + badge + '<p>' + (S.cstage === 'plan' ? '기획안' : '페이지') + ' 이미지 준비 중</p></div>';
    var cap = (imgs.length > 1 && st.caps) ? '<p class="cap">' + esc(st.caps[i]) + '</p>' : '';
    var thumbs = (imgs.length > 1 && st.caps) ? '<div class="thumbs">' + imgs.map(function (x, k) {
      return '<button type="button" data-act="cimg" data-i="' + k + '" aria-pressed="' + (k === i) + '" title="' + esc(st.caps[k]) + '"><img src="' + src(x) + '" alt="' + esc(st.caps[k]) + '"></button>';
    }).join('') + '</div>' : '';
    var hasL = st.l && st.l.length;
    var box = (st.t || hasL) ? '<div class="box">' + (st.t ? esc(st.t) : '') +
      (hasL ? '<ul class="bl"' + (st.t ? ' style="margin-top:10px"' : '') + '>' + st.l.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>' : '';
    var res = (S.cstage === 'after' && c.res) ? '<div class="res">' + c.res.map(function (r) { return '<div><div class="n">' + esc(r.n) + '<sup>' + esc(r.s) + '</sup></div><div class="l">' + esc(r.l) + '</div></div>'; }).join('') + '</div>' : '';
    return shead('Before · Plan · After', '기존 페이지, 기획안, 최종 페이지를 단계별로 비교해 보세요.') +
      '<div class="cmp"><div class="ptabs" role="group" aria-label="카테고리 선택">' + CMP.map(function (x, k) {
        return '<button type="button" data-act="cmp" data-i="' + k + '" aria-pressed="' + (k === S.cmp) + '">' + esc(x.label) + '</button>';
      }).join('') + '</div>' +
      '<div class="body"><div class="txt"><div class="seg" role="group" aria-label="단계">' + ['before', 'plan', 'after'].map(function (k) {
        return '<button type="button" data-act="cside" data-s="' + k + '" aria-pressed="' + (S.cstage === k) + '">' + names[k] + '</button>';
      }).join('') + '</div><h4>' + nums[S.cstage] + esc(st.h) + '</h4>' + box + res + '</div>' +
      '<div class="figure">' + stage + cap + thumbs + '</div></div></div>';
  };

  V.career = function () {
    return shead('Career', '교육 서비스 기획과 AI 자동화 개발 실무 경력입니다.') +
      '<div class="career">' + CAR.map(function (j) {
        return '<article class="job"><div><h3>' + esc(j.org) + '</h3>' + (j.sub ? '<p style="color:var(--muted);font-size:13px">' + esc(j.sub) + '</p>' : '') + '<p class="role">' + esc(j.role) + '</p><span class="per">' + esc(j.per) + '</span></div>' +
          '<div><p class="mini">주요 업무 및 성과</p>' + (j.groups ? j.groups.map(function (g) {
            return '<p class="gh">' + esc(g.h) + '</p><ul class="ck">' + g.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
          }).join('') : '<ul class="ck">' + j.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>') + '</div></article>';
      }).join('') + '</div>';
  };

  V.about = function () {
    var tabs = [['edu', 'Education'], ['act', 'Activities'], ['awd', 'Awards']];
    return shead('About', '') +
      '<div class="about"><div><p class="intro">교육 운영부터 콘텐츠 기획, AI 기반 업무 개선까지 다양한 프로젝트를 수행하며 <b>문제를 발견하고 실행 가능한 개선으로 연결</b>해왔습니다. 구성원의 성장을 지원하는 교육 환경을 만들고, 협업을 통해 조직의 운영 효율을 높이는 HR 담당자를 지향합니다.</p>' +
      '<dl class="cinfo"><div><dt>Phone</dt><dd>+82 10 9205 8075</dd></div><div><dt>Location</dt><dd>Seoul, South Korea</dd></div><div><dt>Email</dt><dd>shj8075@gmail.com</dd></div></dl></div>' +
      '<div><div class="tabs" role="tablist">' + tabs.map(function (t) { return '<button type="button" role="tab" data-act="atab" data-t="' + t[0] + '" aria-selected="' + (S.at === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<ul class="rows">' + ABOUT[S.at].map(function (r) { return '<li><span class="t">' + (r.g ? '<i class="g">' + esc(r.g) + '</i>' : '') + esc(r.t) + '</span>' + (r.d ? '<span class="d">' + esc(r.d) + '</span>' : '') + '<span class="s">' + esc(r.s) + '</span>' + (r.x ? '<ul class="x">' + r.x.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</li>'; }).join('') + '</ul></div></div>';
  };

  V.why = function () {
    return shead('Why Me', '네 가지 역량을 눌러 관련 프로젝트를 확인해 보세요.') +
      '<div class="acc">' + WHY.map(function (w, i) {
        var on = S.why === i;
        return '<div class="card' + (on ? ' on' : '') + '"><button class="hd" type="button" data-act="why" data-i="' + i + '" aria-expanded="' + on + '"><h3>' + w.h + '</h3><span>' + esc(w.s) + '</span></button>' +
          '<div class="bd"><ul class="bl">' + w.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
          '<button class="btn sm" type="button" data-act="open" data-id="' + w.to + '">관련 프로젝트 <span aria-hidden="true">→</span></button></div></div>';
      }).join('') + '</div>' +
      '<div class="closing"><p>AI를 활용해 업무를 개선하고, 교육 콘텐츠를 기획하며, 교육 운영과 상품 기획까지 경험했습니다.</p><p>앞으로도 사용자의 관점에서 더 나은 교육 경험을 만드는 HRD 담당자로 성장하겠습니다.</p></div>';
  };

  V.hello = function () {
    return '<div class="hello"><h2>Say Hello!</h2><p>함께 만들고 싶은 교육 프로젝트나 운영 이야기가 있다면<br><br>편하게 연락 주세요.</p>' +
      '<div class="mail"><span id="mailtext">shj8075@gmail.com</span><button type="button" data-act="copy">복사</button></div>' +
      '<p class="tel">+82 10 9205 8075</p></div>';
  };

  function draw(n) { el('s-' + n).innerHTML = V[n](); }

  /* modal */
  function detail() {
    var p = byId[S.pid]; var m = p.media[S.mi]; var pair = !!m.before;
    var shown = pair ? (S.side === 'before' ? m.before : m.after) : m.img;
    var idx = P.indexOf(p); var prev = P[(idx + P.length - 1) % P.length]; var next = P[(idx + 1) % P.length];
    var many = p.media.length > 1;
    var media = '<div><div class="stagewrap"><button class="stage" type="button" data-act="zoom" aria-label="이미지 크게 보기">' +
      (pair ? '<span class="badge ' + S.side + '">' + (S.side === 'before' ? 'Before' : 'After') + '</span>' : '') +
      '<img id="mainimg" src="' + src(shown) + '" alt="' + esc(m.label) + '"><span class="cnt">' + (S.mi + 1) + ' / ' + p.media.length + '</span><span class="zoomhint">클릭해서 크게 보기</span></button>' +
      (many ? '<button class="sa prev" type="button" data-act="mstep" data-d="-1" aria-label="이전 사진">←</button><button class="sa next" type="button" data-act="mstep" data-d="1" aria-label="다음 사진">→</button>' : '') + '</div>' +
      '<div class="mctl"><span class="cap">' + esc(m.label) + '</span>' +
      (pair ? '<span class="seg" role="group" aria-label="전후 비교"><button type="button" data-act="side" data-s="before" aria-pressed="' + (S.side === 'before') + '">Before</button><button type="button" data-act="side" data-s="after" aria-pressed="' + (S.side === 'after') + '">After</button></span>' : '') + '</div>' +
      '<div class="thumbs">' + p.media.map(function (x, i) {
        return '<button type="button" data-act="media" data-i="' + i + '" aria-pressed="' + (i === S.mi) + '" title="' + esc(x.label) + '"><img src="' + src(x.after || x.img) + '" alt="' + esc(x.label) + '"></button>';
      }).join('') + '</div></div>';

    var tabs = [['ov', '개요'], ['pr', '과정'], ['rs', '성과']];
    var panel = '';
    if (S.tab === 'ov') {
      panel = p.story.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') +
        (p.ba ? '<div class="ba"><div class="b"><small>Before</small>' + esc(p.ba[0]) + '</div><div class="ar" aria-hidden="true">→</div><div class="a"><small>After</small>' + esc(p.ba[1]) + '</div></div>' : '');
    } else if (S.tab === 'pr') {
      panel = (p.contrib ? '<div class="mini">' + esc(p.contribLabel || 'Key Contributions') + '</div><div class="chips">' + p.contrib.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="mini">Process</div><ul class="steps">' + p.steps.map(function (s) {
          return '<li><span class="dot"></span><div><h4>' + esc(s.h) + '</h4><p>' + s.p.map(esc).join('<br>') + '</p></div></li>';
        }).join('') + '</ul>';
    } else {
      var nums = p.results.filter(function (r) { return r.n; });
      var txt = p.results.filter(function (r) { return r.t; });
      panel = (nums.length ? '<div class="res">' + nums.map(function (r) { return '<div><div class="n">' + esc(r.n) + '<sup>' + esc(r.s) + '</sup></div><div class="l">' + esc(r.l) + '</div></div>'; }).join('') + '</div>' : '') +
        (txt.length ? '<div class="mini">' + (nums.length ? 'Result' : 'Scope') + '</div><ul class="bl">' + txt.map(function (r) { return '<li>' + esc(r.t) + '</li>'; }).join('') + '</ul>' : '');
    }
    var info = '<div class="info"><span class="tag">' + esc(p.tag) + '</span><h2>' + esc(p.en) + '</h2><p class="ko-t">' + esc(p.ko) + '</p><p class="lead">' + esc(p.org) + '</p>' +
      '<div class="tabs" role="tablist">' + tabs.map(function (t) { return '<button type="button" role="tab" data-act="tab" data-t="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<div class="tp" role="tabpanel">' + panel + '</div>' +
      '<div class="pn"><button type="button" data-act="open" data-id="' + prev.id + '"><small>← 이전 프로젝트</small>' + esc(prev.en) + '</button>' +
      '<button class="nx" type="button" data-act="open" data-id="' + next.id + '"><small>다음 프로젝트 →</small>' + esc(next.en) + '</button></div></div>';
    return '<div class="mtop"><button type="button" data-act="mclose" id="mclose">← 프로젝트 목록</button><span>' + (idx + 1) + ' / ' + P.length + '</span></div><div class="dgrid">' + media + info + '</div>';
  }

  var md = el('md'), lb = el('lb'), lbimg = el('lbimg'), opener = null;
  function drawModal() { el('mdin').innerHTML = detail(); }
  function openP(id) {
    var wasOpen = !md.hidden;
    if (!wasOpen) opener = document.activeElement;
    S.pid = id; S.mi = 0; S.side = 'after'; S.tab = 'ov';
    drawModal(); md.hidden = false; md.scrollTop = 0; document.documentElement.classList.add('lock');
    var c = el('mclose'); if (c) c.focus();
  }
  function closeP() {
    md.hidden = true; document.documentElement.classList.remove('lock');
    if (opener && opener.focus) { try { opener.focus(); } catch (e) {} }
  }
  function zoom(id) { var im = el(id); lbimg.src = im.src; lbimg.alt = im.alt; lb.classList.toggle('tall', im.naturalHeight / im.naturalWidth > 1.6); lb.classList.toggle('low', im.naturalWidth < 400); lb.hidden = false; lb.scrollTop = 0; }
  function scrollTo(t) { var n = el('s-' + t); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'nav') { scrollTo(t.getAttribute('data-t')); }
    else if (a === 'filter') { S.filter = t.getAttribute('data-f'); draw('projects'); }
    else if (a === 'pillf') { S.filter = t.getAttribute('data-f'); draw('projects'); scrollTo('projects'); }
    else if (a === 'open') { openP(t.getAttribute('data-id')); }
    else if (a === 'mclose') { closeP(); }
    else if (a === 'media') { S.mi = +t.getAttribute('data-i'); drawModal(); }
    else if (a === 'mstep') { var mn = byId[S.pid].media.length; S.mi = (S.mi + (+t.getAttribute('data-d')) + mn) % mn; drawModal(); }
    else if (a === 'side') { S.side = t.getAttribute('data-s'); drawModal(); }
    else if (a === 'tab') { S.tab = t.getAttribute('data-t'); drawModal(); }
    else if (a === 'zoom') { zoom('mainimg'); }
    else if (a === 'zoomc') { zoom('cmpimg'); }
    else if (a === 'lbclose') { lb.hidden = true; }
    else if (a === 'cmp') { S.cmp = +t.getAttribute('data-i'); S.cidx = 0; draw('compare'); }
    else if (a === 'cside') { S.cstage = t.getAttribute('data-s'); draw('compare'); }
    else if (a === 'cimg') { S.cidx = +t.getAttribute('data-i'); draw('compare'); }
    else if (a === 'atab') { S.at = t.getAttribute('data-t'); draw('about'); }
    else if (a === 'why') { S.why = +t.getAttribute('data-i'); draw('why'); }
    else if (a === 'copy') {
      var btn = t, txt = el('mailtext');
      var done = function (m) { btn.textContent = m; setTimeout(function () { btn.textContent = '복사'; }, 1600); };
      var fb = function () { var r = document.createRange(); r.selectNodeContents(txt); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); done('선택됨'); };
      try { navigator.clipboard.writeText(txt.textContent).then(function () { done('복사됨'); }, fb); } catch (err) { fb(); }
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
    if (e.key === 'Escape') { if (!lb.hidden) lb.hidden = true; else if (!md.hidden) closeP(); return; }
    if (!md.hidden && lb.hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      var n = byId[S.pid].media.length;
      S.mi = (S.mi + (e.key === 'ArrowRight' ? 1 : n - 1)) % n; drawModal();
    }
  });

  ['hero', 'statement', 'projects', 'compare', 'career', 'about', 'why', 'hello'].forEach(draw);
  var h = '';
  try { h = (location.hash || '').replace('#', ''); } catch (e) {}
  if (byId[h]) openP(h);
})();
</script>
